name: Tag Main

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - ".**"
      - "**.md"
      - "**.yml"
      - "**.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # # Uncomment to view GitHub context object
  # view-context:
  #   # https://docs.github.com/en/actions/learn-github-actions/contexts
  #   name: View GitHub Context
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Echo GitHub context
  #       uses: satackey/action-js-inline@v0.0.2
  #       with:
  #         script: |
  #           const github = require('@actions/github');
  #           console.log(JSON.stringify(github, null, 2));

  build-image:
    name: Build Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          build-args: |
            REPO_LOCATION=

      - name: Dispatch to enrolled repositories
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.POLARIS_COMPOSER_DISPATCH_TOKEN }}
        run: |
          if [ ! -f enrolled-repos.txt ]; then
            echo "No enrolled-repos.txt found, skipping dispatch."
            cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## Polaris Composer Dispatch

          No enrolled-repos.txt found. Skipping dispatch.
          EOF
            exit 0
          fi
          ENROLLED=$(grep -v '^\s*#' enrolled-repos.txt | grep -v '^\s*$' || true)
          if [ -z "${ENROLLED}" ]; then
            echo "No enrolled repositories. Skipping dispatch."
            cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## Polaris Composer Dispatch

          No enrolled repositories. Add entries to `enrolled-repos.txt` to enable automatic refresh.
          EOF
            exit 0
          fi

          SUMMARY_ROWS=""
          while IFS= read -r repo || [[ -n "$repo" ]]; do
            [[ "$repo" =~ ^#.*$ || -z "$repo" ]] && continue
            echo "Checking ${repo}..."

            WORKFLOW_CONTENT=$(gh api repos/${repo}/contents/.github/workflows/polaris-composer-refresh.yaml \
              --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || echo "")

            if [ -z "${WORKFLOW_CONTENT}" ]; then
              echo "  ⚠ ${repo}: workflow file not found, skipping dispatch"
              SUMMARY_ROWS="${SUMMARY_ROWS}| \`${repo}\` | ⚠️ Skipped (workflow not found) |\n"
              continue
            fi

            if ! echo "${WORKFLOW_CONTENT}" | grep -q 'repository_dispatch'; then
              echo "  ⚠ ${repo}: repository_dispatch not enabled, skipping dispatch"
              SUMMARY_ROWS="${SUMMARY_ROWS}| \`${repo}\` | ⚠️ Skipped (repository_dispatch not enabled in workflow) |\n"
              continue
            fi

            echo "Dispatching to ${repo}..."
            if gh api repos/${repo}/dispatches \
              --method POST \
              --field event_type=polaris-composer-update \
              --field "client_payload[composer_ref]=${{ github.sha }}" 2>/dev/null; then
              echo "  ✓ ${repo}"
              SUMMARY_ROWS="${SUMMARY_ROWS}| \`${repo}\` | ✅ Dispatched |\n"
            else
              echo "  ✗ ${repo} (dispatch failed)"
              SUMMARY_ROWS="${SUMMARY_ROWS}| \`${repo}\` | ❌ Failed |\n"
            fi
          done < enrolled-repos.txt

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Polaris Composer Dispatch

          | Repository | Result |
          | - | - |
          $(printf "${SUMMARY_ROWS}")
          EOF
