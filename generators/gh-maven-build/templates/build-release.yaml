name: 'Build and publish - <%= serviceName %>'

on:
<% if (!isMonoRepo) { -%>
  push:
    tags:
      - 'v*'
    branches:
      - 'main'
<% if (relativePath) { -%>
    paths:
      - '<%= relativePath %>/**'
<% } -%>
  pull_request:
    branches:
      - main
<% if (relativePath) { -%>
    paths:
      - '<%= relativePath %>/**'
<% } -%>
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
<% } else { -%>
  workflow_call:
<% } -%>

env:
  BROKER_URL: https://broker.io.nrs.gov.bc.ca
  BROKER_JWT: ${{ secrets.<%= brokerJwt %> }}
  SERVICE_PROJECT: <%= projectName %>
  SERVICE_NAME: <%= serviceName %>
  DEFAULT_VERSION: ${{ vars.DEFAULT_VERSION || '0.0.0' }}-SNAPSHOT

jobs:
  setup-build:
    name: Setup Build
    uses: ./.github/workflows/setup-build.yaml
    with:
      service_name: <%= serviceName %>
      project_name: <%= projectName %>
      default_version: ${{ vars.DEFAULT_VERSION || '0.0.0' }}-SNAPSHOT
      relative_path: '<%= relativePath %>'
      git_hub_project_slug: '<%= gitHubProjectSlug %>'
      broker_jwt_secret: '<%= brokerJwt %>'
      is_library: <%= type === 'library' %>
<% if (unitTestsPath) { -%>
  test:
    name: Test
    uses: <%= unitTestsPath %>
<% } -%>
  build-publish:
    name: Build and publish
    runs-on: ubuntu-latest
<% if (unitTestsPath) { -%>
    needs: [setup-build, test]
<% } else { -%>
    needs: setup-build
<% } -%>
    permissions:
      contents: read
      packages: write
    outputs:
      project_version: ${{ steps.set-build-output-parameters.outputs.project_version }}
      intention_id: ${{ steps.set-intention-id.outputs.intention_id }}
    steps:
      - name: Use setup outputs
        run: |
          echo "Checkout ref: ${{ needs.setup-build.outputs.checkout_ref }}"
          echo "Version modifier: ${{ needs.setup-build.outputs.version_modifier }}"
          echo "Version: ${{ needs.setup-build.outputs.version }}"
          echo "Git commit: ${{ needs.setup-build.outputs.git_commit }}"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '<%= javaVersion %>'
          distribution: 'temurin'
          cache: maven

      - name: Set build output parameters
        id: set-build-output-parameters
        run: |
          source ./env.sh build ./<%= relativePath %> --skip-vault
          echo "project_version=${VERSION}" >> $GITHUB_OUTPUT
          echo "artifact_id=$(./mvnw help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> $GITHUB_OUTPUT
          echo "package_type=$(./mvnw help:evaluate -Dexpression=project.packaging -q -DforceStdout)" >> $GITHUB_OUTPUT
<% if (type !== 'library' && ociArtifacts.length > 0) { _%>
      - name: Pull static artifacts
        run: |
          oras login ghcr.io -u ${{ github.actor }} --password-stdin <<< ${{ secrets.GITHUB_TOKEN }}
          <%_ for (const artifact of ociArtifacts) { _%>
          echo "Pulling artifact <%= artifact.artifact %> to <%= artifact.output %>"
          oras pull <%= artifact.artifact %> --output <%= artifact.output %>
          oras manifest fetch -o <%= artifact.output %>/manifest.json <%= artifact.artifact %>
          <%_ } -%>
        working-directory: ./<%= relativePath %>
        env:
          PROJECT_TAG: ${{ needs.setup-build.outputs.version }}
<% } -%>
<% if (type !== 'library') { -%>
      - name: Publish artifact
        id: publish-artifact
        working-directory: ./
        run: |
          source ./env.sh build ./<%= relativePath %> --skip-vault
          PACKAGE_DIR="${PUBLISH_DIR:-<%= publishArtifactSuffix %>}"
          PACKAGE_DIR="${PACKAGE_DIR%% *}"
          ./mvnw <%= mavenBuildCommand %> -Dpublish.dir="$PACKAGE_DIR"
          ARTIFACT_FILE="target/${ARTIFACT_ID}-${PROJECT_VERSION}.${PACKAGE_TYPE}"
          if [ ! -f "$ARTIFACT_FILE" ]; then
            echo "::error ::Expected Maven output not found: $ARTIFACT_FILE"
            exit 1
          fi
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"
          unzip -o "$ARTIFACT_FILE" -d "$PACKAGE_DIR"

          cat <<EOF > annotation.json
          {
            "\$manifest": {
              "org.opencontainers.image.description": "Build artifact for <%= serviceName %> version ${PROJECT_TAG}",
              "org.opencontainers.image.licenses": "<%= license %>",
              "org.opencontainers.image.source": "${{ github.repositoryUrl }}",
              "org.opencontainers.image.title": "<%= serviceName %>-artifact",
              "org.opencontainers.image.version": "${PROJECT_TAG}"
            }
          }
          EOF
          cd "$PACKAGE_DIR"
          oras login ghcr.io -u ${{ github.actor }} --password-stdin <<< ${{ secrets.GITHUB_TOKEN }}
          oras push --annotation-file ../annotation.json --export-manifest ../manifest.json ghcr.io/${{ github.repository }}/<%= serviceName %>:${PROJECT_TAG} .
          MANIFEST=$(cat ../manifest.json)
          echo $MANIFEST
          echo "artifact_sha256=$(echo $MANIFEST | jq -r '.layers | map(.digest) | join(",")' | sha256sum | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "artifact_size=$(echo $MANIFEST | jq -r '.layers | map(.size) | add')" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
<% if (toolsBuildSecrets) { for (const secret of toolsBuildSecrets.split(',')) { -%>
          <%= secret.toUpperCase() %>: ${{ secrets.<%= secret.toUpperCase() %> }}
<% } } -%>
          PROJECT_VERSION: ${{ needs.setup-build.outputs.version }}
          PROJECT_TAG: ${{ needs.setup-build.outputs.version }}
          ARTIFACT_ID: ${{ steps.set-build-output-parameters.outputs.artifact_id }}
          PACKAGE_TYPE: ${{ steps.set-build-output-parameters.outputs.package_type }}
      - name: Send build info
        run: |
          curl -s POST ${{ env.BROKER_URL }}/v1/intention/action/patch \
              -H 'Content-Type: application/json' \
              -H 'X-Broker-Token: '"${BUILD_TOKEN}"'' \
              -d '{"package":{"checksum": "sha256:'${ARTIFACT_SHA256}'", "size": '${ARTIFACT_SIZE}'}}'
        env:
          ARTIFACT_SHA256: ${{ steps.publish-artifact.outputs.artifact_sha256 }}
          ARTIFACT_SIZE: ${{ steps.publish-artifact.outputs.artifact_size }}
          BUILD_TOKEN: ${{ env.ACTION_TOKEN_BUILD }}
<% } else { -%>
      - name: Publish artifact
        run: |
          source ./env.sh build ./<%= relativePath %> --skip-vault
          PACKAGE_DIR="${PUBLISH_DIR:-<%= publishArtifactSuffix %>}"
          PACKAGE_DIR="${PACKAGE_DIR%% *}"
          ./mvnw <%= mavenBuildCommand %> -Dpublish.dir="$PACKAGE_DIR"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
<% if (toolsBuildSecrets) { for (const secret of toolsBuildSecrets.split(',')) { -%>
          <%= secret.toUpperCase() %>: ${{ secrets.<%= secret.toUpperCase() %> }}
<% } } -%>
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_URL: ${{ github.repositoryUrl }}
<% } -%>
      - name: Close intention
        if: ${{ success() && needs.setup-build.outputs.intention_token != '' }}
        uses: bcgov-nr/action-broker-intention-close@v3
        with:
          intention_token: ${{ needs.setup-build.outputs.intention_token }}
      - name: Close intention (Failure)
        if: ${{ failure() && needs.setup-build.outputs.intention_token != '' }}
        uses: bcgov-nr/action-broker-intention-close@v3
        with:
          intention_token: ${{ needs.setup-build.outputs.intention_token }}
          outcome: failure
      - name: Generate build summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Build Summary

          | | |
          | - | - |
          | **Ref** | \`${{ needs.setup-build.outputs.checkout_ref }}\` |
          | **Commit** | [${COMMIT_HASH:0:7}](https://github.com/${{ github.repository }}/tree/${COMMIT_HASH}) |
          | **Version** | ${PROJECT_VERSION} |
<% if (type !== 'library') { -%>
          | **Artifact SHA256** | ${ARTIFACT_SHA256} |
<% } -%>

          EOF
        env:
          COMMIT_HASH: ${{ needs.setup-build.outputs.git_commit }}
          PROJECT_VERSION: ${{ needs.setup-build.outputs.version }}
<% if (type !== 'library') { -%>
          ARTIFACT_SHA256: ${{ steps.publish-artifact.outputs.artifact_sha256 }}
<% } -%>

