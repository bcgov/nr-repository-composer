name: Setup Build

on:
  workflow_call:
    inputs:
      service_name:
        description: 'Service name'
        type: string
        required: true
      project_name:
        description: 'Project name'
        type: string
        required: true
      default_version:
        description: 'Default version for non-tag builds'
        type: string
        required: true
      relative_path:
        description: 'Relative path to service in monorepo'
        type: string
        required: false
        default: ''
      git_hub_project_slug:
        description: 'GitHub repository slug (org/repo)'
        type: string
        required: true
      broker_jwt_secret:
        description: 'Secret name for broker JWT'
        type: string
        required: true
      is_library:
        description: 'Whether this is a library build'
        type: boolean
        required: false
        default: false
      unit_tests_path:
        description: 'Path to unit tests workflow'
        type: string
        required: false
        default: ''
    outputs:
      checkout_ref:
        description: 'The resolved checkout ref'
        value: ${{ jobs.setup.outputs.checkout_ref }}
      version_modifier:
        description: 'Version modifier (branch, PR number, or tag)'
        value: ${{ jobs.setup.outputs.version_modifier }}
      version:
        description: 'Calculated version for this build'
        value: ${{ jobs.setup.outputs.version }}
      git_commit:
        description: 'Git commit hash'
        value: ${{ jobs.setup.outputs.git_commit }}
      build_guid:
        description: 'Build GUID for tracking'
        value: ${{ jobs.setup.outputs.build_guid }}
      intention_id:
        description: 'Broker intention ID'
        value: ${{ jobs.setup.outputs.intention_id }}
      intention_token:
        description: 'Broker intention token'
        value: ${{ jobs.setup.outputs.intention_token }}

env:
  BROKER_URL: https://broker.io.nrs.gov.bc.ca
  SERVICE_PROJECT: ${{ inputs.project_name }}
  SERVICE_NAME: ${{ inputs.service_name }}

jobs:
  preflight:
    name: Preflight
    uses: ./.github/workflows/preflight.yaml
    permissions:
      contents: read
      actions: read
    with:
      preflight_context: build
      catalog_info: ${{ inputs.relative_path }}${{ inputs.relative_path && '/' || '' }}catalog-info.yaml
    secrets:
      token: ${{ secrets[inputs.broker_jwt_secret] }}

  setup:
    name: Setup Build Environment
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read
    outputs:
      checkout_ref: ${{ steps.lookup-pr-merge-ref.outputs.checkout_ref }}
      version_modifier: ${{ steps.lookup-pr-merge-ref.outputs.version_modifier }}
      version: ${{ steps.set-version.outputs.version }}
      git_commit: ${{ steps.set-build-output-parameters.outputs.git_commit }}
      build_guid: ${{ steps.set-build-output-parameters.outputs.build_guid }}
      intention_id: ${{ steps.set-intention-id.outputs.intention_id }}
      intention_token: ${{ steps.set-intention-id.outputs.intention_token }}
    steps:
      - name: Lookup PR Merge Ref
        id: lookup-pr-merge-ref
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "checkout_ref=${{ github.ref }}" >> $GITHUB_OUTPUT
            echo "version_modifier=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [[ ${{ github.ref_name != 'main' }} = true ]]; then
            RESPONSE=$(curl -s "https://api.github.com/repos/${{ inputs.git_hub_project_slug }}/pulls?head=${{ inputs.git_hub_project_slug }}:${{ github.head_ref || github.ref_name }}&state=open&base=main" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json")
            PULL_REQUEST_NUMBER=$(echo "${RESPONSE}" | jq -r .[0].number)
            RESPONSE=$(curl -s "https://api.github.com/repos/${{ inputs.git_hub_project_slug }}/pulls/$PULL_REQUEST_NUMBER" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json")
            MERGEABLE=$(echo "${RESPONSE}" | jq -r .mergeable)
            if [[ "$MERGEABLE" != "true" ]]; then
              echo "::error ::Pull request #$PULL_REQUEST_NUMBER is not mergeable… aborted."
              echo "This can be resolved by resolving the merge conflict with the main branch."
              exit 1
            fi
            echo "checkout_ref=refs/pull/$PULL_REQUEST_NUMBER/merge" >> $GITHUB_OUTPUT
            echo "version_modifier=$PULL_REQUEST_NUMBER" >> $GITHUB_OUTPUT
          else
            echo "checkout_ref=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "version_modifier=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ steps.lookup-pr-merge-ref.outputs.checkout_ref }}

      - name: Setup ORAS
        if: ${{ !inputs.is_library }}
        uses: oras-project/setup-oras@v2

      - name: Set version
        id: set-version
        run: |
          if [[ ${{ startsWith(github.ref, 'refs/tags/v') }} = true ]]; then
            TAG=${{ github.ref_name }}
            APP_VERSION=${TAG#v}
          else
            APP_VERSION=${DEFAULT_VERSION/%-SNAPSHOT/-${{ steps.lookup-pr-merge-ref.outputs.version_modifier }}-SNAPSHOT}
          fi
          echo "version=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION=${APP_VERSION}" >> $GITHUB_ENV
        env:
          DEFAULT_VERSION: ${{ inputs.default_version }}

      - name: Set build output parameters
        id: set-build-output-parameters
        run: |
          source ./env.sh build ./${{ inputs.relative_path }} --skip-vault
          echo "project_version=${VERSION}" >> $GITHUB_OUTPUT
          echo "git_commit=$(git rev-parse --verify HEAD)" >> $GITHUB_OUTPUT
          echo "build_guid=uuid::$(uuidgen)" >> $GITHUB_OUTPUT

      - name: Build intention
        run: sh ./.github/workflows/build-intention-${{ inputs.service_name }}.sh
        env:
          EVENT_REASON: Build ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository}}
          GITHUB_RUN_ID: ${{ github.run_id}}
          PACKAGE_BUILD_GUID: ${{ steps.set-build-output-parameters.outputs.build_guid }}
          PACKAGE_BUILD_NUMBER: ${{ github.run_number }}
          PACKAGE_BUILD_VERSION: ${{ steps.set-build-output-parameters.outputs.git_commit }}
          PACKAGE_TYPE: application/vnd.oci.image.layer.v1.tar+gzip
          PACKAGE_VERSION: ${{ steps.set-build-output-parameters.outputs.project_version }}

      - name: Open intention
        uses: bcgov-nr/action-broker-intention-open@v2
        with:
          broker_jwt: ${{ secrets[inputs.broker_jwt_secret] }}
          intention_path: intention.json
          quickstart: true

      - name: Set intention outputs
        id: set-intention-id
        run: |
          echo "intention_id=${INTENTION_ID}" >> $GITHUB_OUTPUT
          echo "intention_token=${INTENTION_TOKEN}" >> $GITHUB_OUTPUT
        env:
          INTENTION_ID: ${{ env.INTENTION_ID }}
          INTENTION_TOKEN: ${{ env.INTENTION_TOKEN }}
