name: Build and publish - <%= serviceName %>

on:
<% if (!isMonoRepo) { -%>
  push:
    tags:
      - 'v*'
    branches:
      - 'main'
<% if (relativePath) { -%>
    paths:
      - '<%= relativePath %>/**'
<% } -%>
  pull_request:
    branches:
      - main
<% if (relativePath) { -%>
    paths:
      - '<%= relativePath %>/**'
<% } -%>
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
<% } else { -%>
  workflow_call:
<% } -%>

env:
  BROKER_URL: https://broker.io.nrs.gov.bc.ca
  BROKER_JWT: ${{ secrets.<%= brokerJwt %> }}
  SERVICE_PROJECT: <%= projectName %>
  SERVICE_NAME: <%= serviceName %>
  DEFAULT_VERSION: ${{ vars.DEFAULT_VERSION || '0.0.0' }}-SNAPSHOT

jobs:
  preflight:
    name: Preflight
    uses: ./.github/workflows/preflight.yaml
    permissions:
      contents: read
      actions: read
    with:
      preflight_context: build
      catalog_info: <%= relativePath %><%= relativePath ? '/' : '' %>catalog-info.yaml
    secrets:
      token: ${{ secrets.<%= brokerJwt %> }}
<% if (unitTestsPath) { -%>
  test:
    name: Test
    uses: <%= unitTestsPath %>
    permissions:
      contents: read
<% } -%>
  build-publish:
    name: Build and publish
    runs-on: ubuntu-latest
<% if (unitTestsPath) { -%>
    needs: [preflight, test]
<% } else { -%>
    needs: preflight
<% } -%>
    permissions:
      contents: read
      packages: write
      pull-requests: read
    outputs:
      project_version: ${{ steps.set-build-output-parameters.outputs.project_version }}
      intention_id: ${{ steps.set-intention-id.outputs.intention_id }}
    if: ${{ needs.preflight.outputs.can_rebuild == 'true' }}
    steps:
      - name: Sparse checkout actions
        uses: actions/checkout@v6
        with:
          sparse-checkout: '.github/actions/version-detect'
      - name: Version detect
        id: version-detect
        uses: ./.github/actions/version-detect
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_VERSION: ${{ env.DEFAULT_VERSION }}
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
            fetch-depth: 0
            fetch-tags: true
            ref: ${{ steps.version-detect.outputs.checkout_ref }}
      - name: Setup ORAS
        if: ${{ '<%= type %>' != 'library' || <%= ociArtifacts.length > 0 %> }}
        uses: oras-project/setup-oras@v2
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '<%= javaVersion %>'
          distribution: 'temurin'
          cache: maven
      - name: Set build output parameters
        id: set-build-output-parameters
        run: |
          source ./env.sh build ./<%= relativePath %> --skip-vault
          echo "project_version=${VERSION}" >> $GITHUB_OUTPUT
          echo "artifact_id=$(./mvnw help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> $GITHUB_OUTPUT
          echo "package_type=$(./mvnw help:evaluate -Dexpression=project.packaging -q -DforceStdout)" >> $GITHUB_OUTPUT
          echo "git_commit=$(git rev-parse --verify HEAD)" >> $GITHUB_OUTPUT
          echo "build_guid=uuid::$(uuidgen)" >> $GITHUB_OUTPUT
        env:
          VERSION: ${{ steps.version-detect.outputs.version }}
      - name: Build intention
        run: sh ./.github/workflows/build-intention-<%= serviceName %>.sh
        env:
          EVENT_REASON: Build ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository}}
          GITHUB_RUN_ID: ${{ github.run_id}}
          PACKAGE_BUILD_GUID:  ${{ steps.set-build-output-parameters.outputs.build_guid }}
          PACKAGE_BUILD_NUMBER: ${{ github.run_number }}
          PACKAGE_BUILD_VERSION: ${{ steps.set-build-output-parameters.outputs.git_commit }}
          PACKAGE_TYPE: ${{ '<%= type %>' != 'library' && 'application/vnd.oci.image.layer.v1.tar+gzip' || steps.set-build-output-parameters.outputs.package_type }}
          PACKAGE_VERSION: ${{ steps.set-build-output-parameters.outputs.project_version }}
      - name: Open intention
        uses: bcgov-nr/action-broker-intention-open@v2
        with:
          broker_jwt: ${{ secrets.<%= brokerJwt %> }}
          intention_path: intention.json
          quickstart: true
      - name: Echo intention ID for deploy job
        id: set-intention-id
        run: |
          echo "intention_id=${INTENTION_ID}" >> $GITHUB_OUTPUT
        env:
          INTENTION_ID: ${{ env.INTENTION_ID }}
      - name: Pull static artifacts
        if: ${{ '<%= type %>' != 'library' && <%= ociArtifacts.length > 0 %> }}
        uses: ./.github/actions/pull-static-artifacts
        with:
          oci_artifacts: '<%= JSON.stringify(ociArtifacts) %>'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: ./<%= relativePath %>
      - name: Build artifact
        if: ${{ '<%= type %>' != 'library' }}
        working-directory: ./
        run: |
          source ./env.sh build ./<%= relativePath %> --skip-vault
          PACKAGE_DIR="${PUBLISH_DIR:-<%= publishArtifactSuffix %>}"
          PACKAGE_DIR="${PACKAGE_DIR%% *}"
          ./mvnw <%= mavenBuildCommand %> -Dpublish.dir="$PACKAGE_DIR"
          ARTIFACT_FILE="<%= pomRoot %>target/${ARTIFACT_ID}-${PROJECT_VERSION}.${PACKAGE_TYPE}"
          if [ ! -f "$ARTIFACT_FILE" ]; then
            echo "::error ::Expected Maven output not found: $ARTIFACT_FILE"
            exit 1
          fi
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"
          unzip -o "$ARTIFACT_FILE" -d "$PACKAGE_DIR"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
<% if (toolsBuildSecrets) { for (const secret of toolsBuildSecrets.split(',')) { -%>
          <%= secret.toUpperCase() %>: ${{ secrets.<%= secret.toUpperCase() %> }}
<% } } -%>
          PROJECT_VERSION: ${{ steps.set-build-output-parameters.outputs.project_version }}
          PROJECT_TAG: ${{ steps.set-build-output-parameters.outputs.project_version }}
          ARTIFACT_ID: ${{ steps.set-build-output-parameters.outputs.artifact_id }}
          PACKAGE_TYPE: ${{ steps.set-build-output-parameters.outputs.package_type }}
          VERSION: ${{ steps.version-detect.outputs.version }}
      - name: Publish artifact
        if: ${{ '<%= type %>' != 'library' }}
        id: publish-artifact
        uses: ./.github/actions/oci-publish
        with:
          service_name: <%= serviceName %>
          license: <%= license %>
          project_tag: ${{ steps.set-build-output-parameters.outputs.project_version }}
          publish_dir: .
          working-directory: <%= publishArtifactSuffix %>
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Send build info
        if: ${{ '<%= type %>' != 'library' }}
        run: |
          curl -s -X POST ${{ env.BROKER_URL }}/v1/intention/action/patch \
              -H 'Content-Type: application/json' \
              -H 'X-Broker-Token: '"${BUILD_TOKEN}"'' \
              --retry 2 \
              --max-time 30 \
              --connect-timeout 10 \
              --retry-delay 5 \
              -d '{"package":{"checksum": "sha256:'${ARTIFACT_SHA256}'", "size": '${ARTIFACT_SIZE}'}}'
        env:
          ARTIFACT_SHA256: ${{ steps.publish-artifact.outputs.artifact_sha256 }}
          ARTIFACT_SIZE: ${{ steps.publish-artifact.outputs.artifact_size }}
          BUILD_TOKEN: ${{ env.ACTION_TOKEN_BUILD }}
      - name: Publish library artifact
        if: ${{ '<%= type %>' == 'library' }}
        run: |
          source ./env.sh build ./<%= relativePath %> --skip-vault
          PACKAGE_DIR="${PUBLISH_DIR:-<%= publishArtifactSuffix %>}"
          PACKAGE_DIR="${PACKAGE_DIR%% *}"
          ./mvnw <%= mavenBuildCommand %> -Dpublish.dir="$PACKAGE_DIR"
        env:
          VERSION: ${{ steps.version-detect.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
<% if (toolsBuildSecrets) { for (const secret of toolsBuildSecrets.split(',')) { -%>
          <%= secret.toUpperCase() %>: ${{ secrets.<%= secret.toUpperCase() %> }}
<% } } -%>
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_URL: ${{ github.repositoryUrl }}
      - name: Close intention
        if: ${{ success() && env.INTENTION_TOKEN != '' }}
        uses: bcgov-nr/action-broker-intention-close@v3
        with:
          intention_token: ${{ env.INTENTION_TOKEN }}
      - name: Close intention (Failure)
        if: ${{ failure() && env.INTENTION_TOKEN != '' }}
        uses: bcgov-nr/action-broker-intention-close@v3
        with:
          intention_token: ${{ env.INTENTION_TOKEN }}
          outcome: failure
      - name: Generate build summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Build Summary

          | | |
          | - | - |
          | **Ref** | \`${{ env.CHECKOUT_REF }}\` |
          | **Commit** | [${COMMIT_HASH:0:7}](https://github.com/${{ github.repository }}/tree/${COMMIT_HASH}) |
          | **Version** | ${PROJECT_VERSION} |

          EOF
          if [ "<%= type %>" != "library" ]; then
            echo "| **Artifact SHA256** | ${ARTIFACT_SHA256} |" >> $GITHUB_STEP_SUMMARY
          fi
        env:
          CHECKOUT_REF: ${{ steps.version-detect.outputs.checkout_ref }}
          COMMIT_HASH: ${{ steps.set-build-output-parameters.outputs.git_commit }}
          PROJECT_VERSION: ${{ steps.set-build-output-parameters.outputs.project_version }}
          ARTIFACT_SHA256: ${{ steps.publish-artifact.outputs.artifact_sha256 || 'N/A' }}

