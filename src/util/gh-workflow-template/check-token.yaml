name: Check token expiration

on:
  workflow_call:
    inputs:
      allow_untracked_build:
        description: "Warn and permit an untracked build if token validation fails"
        default: false
        type: boolean
      url:
        description: "The Broker URL"
        default: https://broker.io.nrs.gov.bc.ca
        type: string
    secrets:
      token:
        description: "The Broker token"
        required: true
    outputs:
      valid:
        description: "Whether Broker token validation succeeded"
        value: ${{ jobs.check-jwt.outputs.valid }}
permissions: {}

jobs:
  check-jwt:
    name: Check broker token
    outputs:
      valid: ${{ steps.validate.outcome == 'success' }}
<% if (customRunner.startsWith('group:')) { -%>
    runs-on:
      <%= customRunner %>
<% } else { -%>
    runs-on: <%= customRunner %>
<% } -%>
    steps:
      - name: Display runner public IP
        shell: bash
        run: |
          set +e
          RUNNER_PUBLIC_IP=$(curl -fsS --max-time 10 https://api.ipify.org)
          CURL_EXIT_CODE=$?
          set -e

          if [ "$CURL_EXIT_CODE" -eq 0 ] && [ -n "$RUNNER_PUBLIC_IP" ]; then
            echo "Runner public IP: $RUNNER_PUBLIC_IP"
          else
            echo "Runner public IP: unavailable"
          fi

      - name: Check token expiration
        id: validate
        continue-on-error: ${{ inputs.allow_untracked_build }}
        env:
          BROKER_JWT: ${{ secrets.token }}
          BROKER_URL: ${{ inputs.url }}
        shell: bash
        run: |
          if [[ -z "$BROKER_JWT" ]]; then
            echo "Error: Broker token is empty."
            exit 1
          fi
          TOKEN_CHECK_URL="${BROKER_URL}/v1/health/token-check"
          CURL_ERR_FILE=$(mktemp)

          set +e
          RESPONSE_CODE=$(curl -o /dev/null -sS -w "%{http_code}" -X 'GET' \
            "$TOKEN_CHECK_URL" \
            -H 'accept: */*' \
            -H "Authorization: Bearer ${BROKER_JWT}" \
            --fail \
            --retry 2 \
            --retry-all-errors \
            --max-time 30 \
            --connect-timeout 10 \
            --retry-delay 5 \
            2>"${CURL_ERR_FILE}" \
          )
          CURL_EXIT_CODE=$?
          set -e

          if [ "$CURL_EXIT_CODE" -ne 0 ]; then
            if [ "$CURL_EXIT_CODE" -eq 28 ]; then
              echo "Error: Timed out while checking Broker token (curl exit code 28)."
              echo "URL: ${TOKEN_CHECK_URL}"
              echo "Timeout settings: connect-timeout=10s, max-time=30s, retry=2"
              echo "This usually indicates temporary network latency or Broker endpoint slowness."
            else
              echo "Error: Broker token check request failed (curl exit code ${CURL_EXIT_CODE})."
              echo "URL: ${TOKEN_CHECK_URL}"
            fi

            if [ -s "${CURL_ERR_FILE}" ]; then
              echo "curl error output:"
              cat "${CURL_ERR_FILE}"
            fi

            rm -f "${CURL_ERR_FILE}"
            exit 1
          fi

          rm -f "${CURL_ERR_FILE}"

          if [ "$RESPONSE_CODE" = "401" ]; then
            echo "Unauthorized (401)"
            exit 1
          elif [ "$RESPONSE_CODE" = "403" ]; then
            echo "Invalid JWT: Block list has match"
            exit 1
          elif [ "$RESPONSE_CODE" = "000" ]; then
            echo "Error: No HTTP response received from Broker token-check endpoint."
            exit 1
          else
            echo "Response code: $RESPONSE_CODE"
          fi
          if [[ ! "$RESPONSE_CODE" =~ ^2[0-9][0-9]$ ]]; then
            echo "Error: Broker token validation returned an unsuccessful HTTP response."
            exit 1
          fi

      - name: Warn about untracked build
        if: ${{ !cancelled() && inputs.allow_untracked_build && steps.validate.outcome == 'failure' }}
        shell: bash
        run: echo "::warning::Broker token validation failed. Building without Broker checks or intention recording; release versions may be republished. Deployment still requires successful Broker validation."
